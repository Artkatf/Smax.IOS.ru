<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMAX Messenger</title>
    <!-- Сюда мы вставим CSS -->
    <style>
        :root {
            --bg-color: #f0f2f5;
            --sidebar-bg: #ffffff;
            --chat-bg: #e5ddd5;
            --primary: #0088cc;
            --text-main: #333;
            --text-secondary: #888;
            --border-color: #ddd;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- ЭКРАН ВХОДА --- */
        .auth-screen {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .avatar-picker {
            width: 100px;
            height: 100px;
            background-color: #eee;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            cursor: pointer;
            border: 2px dashed #ccc;
            overflow: hidden;
        }

        .avatar-picker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .auth-input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .auth-input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .auth-input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
        }

        .auth-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .auth-btn:hover { background-color: #006699; }

        /* --- ОСНОВНОЙ ИНТЕРФЕЙС --- */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Сайдбар (список чатов) */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .my-profile-card {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-info h4 { font-size: 16px; color: var(--text-main); }
        .profile-info p { font-size: 12px; color: var(--text-secondary); }

        .chat-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 50px;
        }

        /* Элемент чата в списке */
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-item:hover { background-color: #f5f5f5; }

        .chat-avatar-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .chat-info h5 { font-size: 14px; color: var(--text-main); }
        .chat-info p { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

        /* Окно чата */
        .chat-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #backBtn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-main);
            display: none; /* Скрыта по умолчанию */
        }

        .status-block {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ccc;
            border-radius: 50%;
        }
        .status-dot.online { background-color: #2ecc71; }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 60%;
        }

        .msg-row.friend-msg { align-self: flex-start; }
        .msg-row.my-msg { align-self: flex-end; align-items: flex-end; }

        .msg-author {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-align: left;
        }
        .msg-row.my-msg .msg-author { text-align: right; }

        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .friend-msg .bubble {
            background-color: white;
            border-bottom-left-radius: 2px;
        }

        .my-msg .bubble {
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .input-bar {
            padding: 15px 20px;
            background: white;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
        }

        #messageInput {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
        }

        .send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* --- АДАПТИВНОСТЬ (MOBILE) --- */
        @media (max-width: 768px) {
            body { justify-content: flex-start; padding-top: 20px; }
            
            .auth-screen { width: 100%; border-radius: 0; box-shadow: none; height: 100vh; overflow-y: auto; }
            
            .app-container { flex-direction: column; height: 100vh; }
            .sidebar { width: 100%; max-height: 50vh; border-right: none; border-bottom: 1px solid var(--border-color); }
            
            .app-container.chat-active .sidebar { display: none; }
            .chat-stage { width: 100%; }
            
            #backBtn { display: block; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="authScreen" class="auth-screen">
        <div class="avatar-picker" onclick="document.getElementById('avatarFile').click()">
            <span>📷</span>
            <img id="avatarPreview" src="" alt="Preview">
        </div>
        <input type="file" id="avatarFile" accept="image/*" style="display: none" onchange="previewAvatar(this)">
        
        <div class="auth-input-group">
            <label>Ваше имя</label>
            <input type="text" id="firstNameInput" placeholder="Иван">
        </div>
        <div class="auth-input-group">
            <label>Ваша фамилия</label>
            <input type="text" id="lastNameInput" placeholder="Иванов">
        </div>
        <button class="auth-btn" onclick="saveProfile()">Войти и получить ID</button>
        <p id="generatedIdDisplay" style="margin-top: 15px; font-size: 12px; color: var(--text-secondary); display: none;"></p>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="appContainer" class="app-container" style="display: none;">
        
        <!-- Сайдбар -->
        <div class="sidebar">
            <div class="my-profile-card">
                <img src="https://via.placeholder.com/50" id="myAvatar" class="profile-img" alt="My Avatar">
                <div class="profile-info">
                    <h4 id="myFullNameDisplay">Загрузка...</h4>
                    <p id="myIdDisplay">ID: -</p>
                </div>
            </div>

            <div class="chat-list-container">
                <h3 style="font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase;">Чаты</h3>
                <div id="chatList">
                    <p id="emptyChatList" class="empty-msg">Пока нет чатов</p>
                </div>
            </div>

            <!-- Блок поиска друга (в сайдбаре для десктопа) -->
            <div style="padding: 15px; border-top: 1px solid var(--border-color); background: #fff;">
                <h4 style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">Найти друга по ID</h4>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="friendIdInput" maxlength="5" placeholder="5 цифр" style="flex: 1; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px;">
                    <button onclick="connectToFriend()" style="padding: 8px 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">Найти</button>
                </div>
            </div>
        </div>

        <!-- Окно чата -->
        <div class="chat-stage">
            <div class="chat-header">
                <button id="backBtn" onclick="goBackToChats()">←</button>
                <h3 id="chatWithTitle">Выберите чат</h3>
                <div class="status-block">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Оффлайн</span>
                </div>
            </div>

            <div id="messagesArea" class="messages-area"></div>

            <div class="input-bar">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeypress="handleKeyPress(event)">
                </div>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ PEERJS (обязательно перед script.js) -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <!-- ТВОЙ СКРИПТ (вставлен прямо сюда) -->
    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let myPeer = null;
        let currentConnection = null;
        let currentFriendId = null;
        let chatsHistory = ;
        let myId = '';
        let isLoggedIn = false;

        // --- ИНИЦИАЛИЗАЦИЯ ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedProfile = localStorage.getItem('smax_profile');
            if (savedProfile) {
                const profile = JSON.parse(savedProfile);
                myId = profile.id;
                isLoggedIn = true;
                renderProfile(profile);
                showApp();
                initPeer(myId);
            } else {
                hideApp();
            }
        });

        // --- АВТОРИЗАЦИЯ ---
        function previewAvatar(input) {
            const preview = document.getElementById('avatarPreview');
            if (input.files && input.files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files);
            }
        }

        function saveProfile() {
            const firstName = document.getElementById('firstNameInput').value.trim();
            const lastName = document.getElementById('lastNameInput').value.trim();
            const avatarPreview = document.getElementById('avatarPreview').src;
            
            if (!firstName || !lastName) {
                alert('Пожалуйста, введите Имя и Фамилию');
                return;
            }

            const idDigits = Math.floor(Math.random() * 90000) + 10000;
            myId = String(idDigits); 

            const profile = { firstName, lastName, avatar: avatarPreview, id: myId };
            localStorage.setItem('smax_profile', JSON.stringify(profile));

            renderProfile(profile);
            showApp();
            isLoggedIn = true;
            initPeer(myId);
            
            const idDisplay = document.getElementById('generatedIdDisplay');
            if(idDisplay) {
                idDisplay.style.display = 'block';
                idDisplay.textContent = `Ваш ID: \${myId} (скопируйте его для друзей)`;
            }
        }

        function renderProfile(profile) {
            document.getElementById('myAvatar').src = profile.avatar || 'https://via.placeholder.com/50';
            document.getElementById('myFullNameDisplay').textContent = `${profile.firstName} ${profile.lastName}`;
            document.getElementById('myIdDisplay').textContent = `ID: \${profile.id}`;
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
        }

        function hideApp() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
        }

        // --- PEERJS ЛОГИКА ---
        function initPeer(id) {
            if (myPeer) return;
            myPeer = new Peer(id, { debug: 1 });
            myPeer.on('open', (peerId) => console.log('Peer открыт:', peerId));
            myPeer.on('connection', (conn) => handleIncomingConnection(conn));
        }

        function handleIncomingConnection(conn) {
            conn.on('data', (data) => receiveMessage(conn, data));
            conn.on('error', (err) => console.error(err));
            currentConnection = conn;
            currentFriendId = conn.peer;
            startChatSession(conn);
        }

        // --- ДЕЙСТВИЯ ---
        function connectToFriend() {
            if (!isLoggedIn) { alert('Сначала войдите!'); return; }
            const friendId = document.getElementById('friendIdInput').value.trim();
            
            if (!/^\d{5}\$/.test(friendId)) {
                alert('ID должен состоять ровно из 5 цифр!');
                return;
            }
            if (friendId === myId) { alert('Нельзя написать самому себе!'); return; }

            const conn = myPeer.connect(friendId);
            conn.on('open', () => {
                currentConnection = conn;
                currentFriendId = friendId;
                startChatSession(conn);
                conn.on('data', (data) => receiveMessage(conn, data));
            });
            conn.on('error', (err) => {
                console.error(err);
                alert('Не удалось соединиться. Друг оффлайн или ID неверный.');
            });
        }

        function openChatWith(friendId) {
            if (!isLoggedIn) return;
            if (currentFriendId === friendId) return;
            const conn = myPeer.connect(friendId);
            conn.on('open', () => {
                currentConnection = conn;
                currentFriendId = friendId;
                startChatSession(conn);
                conn.on('data', (data) => receiveMessage(conn, data));
            });
            conn.on('error', () => alert('Друг оффлайн.'));
        }

        function startChatSession(conn) {
            document.getElementById('appContainer').classList.add('chat-active');
            document.getElementById('chatWithTitle').textContent = `Чат с ID: \${currentFriendId}`;
            updateStatus(true);
            addToChatsHistory(currentFriendId, 'Чат открыт');
        }

        function updateStatus(isOnline) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (isOnline) { dot.classList.add('online'); text.textContent = 'В сети'; }
            else { dot.classList.remove('online'); text.textContent = 'Оффлайн'; }
        }

        // --- СООБЩЕНИЯ ---
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !currentConnection) return;
            
            appendMessageToUI(message, 'me');
            currentConnection.send(message);
            addToChatsHistory(currentFriendId, message);
            input.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function receiveMessage(conn, data) {
            appendMessageToUI(data, 'friend');
            addToChatsHistory(conn.peer, data);
        }

        function appendMessageToUI(text, sender) {
            const messagesArea = document.getElementById('messagesArea');
            const msgRow = document.createElement('div');
            msgRow.className = `msg-row \${sender === 'me' ? 'my-msg' : 'friend-msg'}`;

            const authorSpan = document.createElement('div');
            authorSpan.className = 'msg-author';
            authorSpan.textContent = sender === 'me' ? 'Вы' : `Друг (\${currentFriendId})`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            msgRow.appendChild(authorSpan);
            msgRow.appendChild(bubble);
            messagesArea.appendChild(msgRow);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // --- ИСТОРИЯ ЧАТОВ ---
        function loadChatsHistory() {
            const stored = localStorage.getItem('smax_chats');
            chatsHistory = stored ? JSON.parse(stored) : ;
            renderChatsList();
        }

        function addToChatsHistory(friendId, lastMessage) {
            const now = new Date().toLocaleTimeString(, {hour: '2-digit', minute:'2-digit'});
            const entry = { id: friendId, lastMessage, time: now };
            const index = chatsHistory.findIndex(c => c.id === friendId);
            if (index > -1) chatsHistory[index] = entry;
            else chatsHistory.unshift(entry);
            localStorage.setItem('smax_chats', JSON.stringify(chatsHistory));
            renderChatsList();
        }

        function renderChatsList() {
            loadChatsHistory();
            const listContainer = document.getElementById('chatList');
            listContainer.innerHTML = '';
            const emptyMsg = document.getElementById('emptyChatList');

            if (chatsHistory.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';

            chatsHistory.forEach((chat) => {
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => openChatWith(chat.id);

                item.innerHTML = `
                    <div class="chat-avatar-placeholder" style="background-color: hsl(\${chat.id * 13 % 360}, 50%, 50%);">
                        \${chat.id.charAt(0).toUpperCase()}
                    </div>
                    <div class="chat-info">
                        <h5>Друг (\${chat.id})</h5>
                        <p>\${chat.lastMessage}</p>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // --- ВОЗВРАТ ---
        function goBackToChats() {
            if (!currentConnection) return;
            currentConnection.close();
            currentConnection = null;
            currentFriendId = null;
            document.getElementById('appContainer').classList.remove('chat-active');
            updateStatus(false);
            const messagesArea = document.getElementById('messagesArea');
            messagesArea.innerHTML = '';
            messagesArea.scrollTop = 0;
        }
    </script>
</body>
</html>
