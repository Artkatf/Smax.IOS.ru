<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMAX Messenger</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
    <!-- ВАЖНО: Подключаем PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="authScreen" class="auth-screen">
        <h2 class="auth-title">Добро пожаловать</h2>
        
        <div class="avatar-picker" onclick="document.getElementById('avatarInput').click()">
            <img id="avatarPreview" src="" style="display:none;">
            <span>Нажмите для фото</span>
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="previewAvatar(this)">

        <!-- Вертикальная форма -->
        <input type="text" id="firstNameInput" class="auth-input" placeholder="Ваше имя">
        <input type="text" id="lastNameInput" class="auth-input" placeholder="Ваша фамилия">
        
        <button onclick="saveProfile()" class="auth-btn">Войти и получить ID</button>

        <div id="myIdPreviewBox" class="id-container-box" style="margin-top: 15px; display: none;">
            Ваш ID: <strong id="generatedIdDisplay"></strong>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="appContainer" class="app-container">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ: СПИСОК ЧАТОВ -->
        <div class="sidebar">
            <h3 class="app-title">Чаты</h3>
            
            <div class="my-profile-card">
                <img src="" id="myAvatar" class="profile-img" alt="Avatar">
                <div class="profile-info">
                    <h4 id="myFullNameDisplay"></h4>
                    <p id="myIdDisplay"></p>
                </div>
            </div>

            <div id="chatListContainer">
                <div id="emptyChatList" style="color: var(--text-muted); margin-top: 20px; text-align: center;">
                    Пока нет чатов
                </div>
                <div id="chatList"></div>
            </div>

            <div class="search-friend-box">
                <div class="search-label">Найти друга по ID</div>
                <input type="text" id="friendIdInput" class="auth-input" placeholder="Введите 5 цифр">
                <button onclick="connectToFriend()" class="auth-btn" style="margin-top: 10px; font-size: 14px;">Найти и написать</button>
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ: ЧАТ -->
        <div class="chat-stage">
            <div class="chat-header">
                <!-- Кнопка "Назад", если мы в чате -->
                <button id="backBtn" onclick="goBackToChats()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:18px; display:none;">←</button>
                
                <div class="chat-title" id="chatWithTitle">Выберите чат слева</div>
                
                <div class="status-block">
                    <span id="statusText">Оффлайн</span>
                    <div class="status-dot" id="statusDot"></div>
                </div>
            </div>

            <div id="messagesArea" class="messages-area"></div>

            <div class="input-bar">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" class="auth-input" placeholder="Напишите сообщение..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()" class="send-btn">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
