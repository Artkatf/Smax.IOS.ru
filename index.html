<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smax</title>
    <style>
        :root {
            --bg-dark: #0A0A0C;
            --panel-dark: #161618;
            --accent-green: #10B981;
            --bubble-user: #059669;
            --bubble-friend: #222224;
            --text-main: #F4F4F5;
            --text-muted: #A1A1AA;
            --border-color: #27272A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            letter-spacing: -0.5px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: var(--panel-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 24px;
            padding-left: 8px;
            background: linear-gradient(to right, var(--accent-green) 0%, var(--accent-green) 22%, var(--text-main) 22%, var(--text-main) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-green) 0%, var(--accent-green) 25%, var(--text-main) 25%, var(--text-main) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .menu-btn {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--text-main);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
            font-weight: 500;
        }

        .chat-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .status-block {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            width: fit-content;
        }

        .msg-row.my-msg { align-self: flex-end; }
        .msg-row.friend-msg { align-self: flex-start; }

        .msg-author {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            padding: 0 6px;
        }
        .my-msg .msg-author { text-align: right; }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .my-msg .bubble {background-color: var(--bubble-user);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .friend-msg .bubble {
            background-color: var(--bubble-friend);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Форма отправки БЕЗ тега <form> чтобы исключить любые блокировки */
        .input-bar {
            padding: 16px 20px;
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 12px 18px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-green);
        }

        .send-btn {
            background-color: var(--accent-green);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 22px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="app-title">Smax</div>
        <button class="menu-btn">🟢 Smax Комната</button>
        <div style="margin-top: auto; font-size: 11px; color: var(--text-muted); text-align: center;">
            Автономный код v2.0
        </div>
    </div>

    <div class="chat-stage">
        <div class="chat-header">
            <div class="chat-title">Smax</div>
            <div class="status-block">
                <div class="status-dot"></div>
                <span style="color: var(--text-muted);">Активен</span>
            </div>
        </div>
        
        <div class="messages-area" id="msg-box">
            <!-- Сюда будут падать сообщения -->
        </div>

        <div class="input-bar">
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Наберите текст..." autocomplete="off">
                <button class="send-btn" id="send-click">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const msgBox = document.getElementById('msg-box');
        const msgInput = document.getElementById('msg-input');
        const sendClick = document.getElementById('send-click');

        // Проверяем, есть ли уже переписка в ссылке
        function loadHistory() {
            const params = new URLSearchParams(window.location.search);
            const history = params.get('chat');
            if (history) {
                const messages = history.split('||');
                messages.forEach(m => {
                    if(!m) return;
                    const data = m.split('::');
                    const sender = data[0];
                    const text = decodeURIComponent(data[1]);
                    addMessageToScreen(sender === 'me' ? 'Вы' : 'Друг', text, sender === 'me' ? 'my-msg' : 'friend-msg');
                });
            } else {
                addMessageToScreen('Система', 'Добро пожаловать в Smax! Напишите текст и нажмите Отправить.', 'friend-msg');
            }
        }

        function addMessageToScreen(author, text, className) {
            const row = document.createElement('div');
            row.classList.add('msg-row', className);
            row.innerHTML = `
                <div class="msg-author">${author}</div>
                <div class="bubble">${text}</div>
            `;
            msgBox.appendChild(row);
            msgBox.scrollTop = msgBox.scrollHeight;}

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            // Выводим сообщение на экран
            addMessageToScreen('Вы', text, 'my-msg');

            // Обновляем адресную строку, добавляя текст в ссылку
            const params = new URLSearchParams(window.location.search);
            let currentChat = params.get('chat') || '';
            currentChat += (currentChat ? '||' : '') + 'friend::' + encodeURIComponent(text); // Для друга это придет как friend
            
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?chat=' + currentChat;
            window.history.pushState({path:newUrl}, '', newUrl);

            msgInput.value = '';
        }

        // Самая надежная привязка событий в JavaScript без посредников
        sendClick.onclick = function() {
            sendMessage();
        };

        msgInput.onkeydown = function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        };

        // Запуск при старте страницы
        window.onload = loadHistory;
    </script>

</body>
</html>
