<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smax</title>
    <!-- Подключаем надежную сеть для передачи сообщений в реальном времени -->
    <script src="https://pubnub.com"></script>
    <style>
        :root {
            --bg-dark: #0A0A0C;
            --panel-dark: #161618;
            --accent-green: #10B981;
            --bubble-user: #059669;
            --bubble-friend: #222224;
            --text-main: #F4F4F5;
            --text-muted: #A1A1AA;
            --border-color: #27272A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            letter-spacing: -0.5px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: var(--panel-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 24px;
            padding-left: 8px;
            background: linear-gradient(to right, var(--accent-green) 0%, var(--accent-green) 22%, var(--text-main) 22%, var(--text-main) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-green) 0%, var(--accent-green) 25%, var(--text-main) 25%, var(--text-main) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .menu-btn {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--text-main);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
            font-weight: 500;
        }

        .chat-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .status-block {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            width: fit-content;
        }

        .msg-row.my-msg { align-self: flex-end; }
        .msg-row.friend-msg { align-self: flex-start; }

        .msg-author {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            padding: 0 6px;
        }
        .my-msg .msg-author { text-align: right; }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;line-height: 1.4;
            word-break: break-word;
        }

        .my-msg .bubble {
            background-color: var(--bubble-user);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .friend-msg .bubble {
            background-color: var(--bubble-friend);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .input-bar {
            padding: 16px 20px;
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 12px 18px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-green);
        }

        .send-btn {
            background-color: var(--accent-green);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 22px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="app-title">Smax</div>
        <button class="menu-btn">🟢 Smax Комната</button>
        <div style="margin-top: auto; font-size: 11px; color: var(--text-muted); text-align: center;">
            Режим: Онлайн
        </div>
    </div>

    <div class="chat-stage">
        <div class="chat-header">
            <div class="chat-title">Smax</div>
            <div class="status-block">
                <div class="status-dot"></div>
                <span style="color: var(--text-muted);" id="online-status">Сеть активна</span>
            </div>
        </div>
        
        <div class="messages-area" id="msg-box">
            <div class="msg-row friend-msg">
                <div class="msg-author">Система</div>
                <div class="bubble">Онлайн-режим запущен! Скиньте чистую ссылку на этот сайт другу, и вы сможете общаться в реальном времени.</div>
            </div>
        </div>

        <div class="input-bar">
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Наберите текст..." autocomplete="off">
                <button class="send-btn" id="send-click">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const msgBox = document.getElementById('msg-box');
        const msgInput = document.getElementById('msg-input');
        const sendClick = document.getElementById('send-click');

        // Создаем случайный уникальный ID для вашей сессии (чтобы код понимал, кто "Вы", а кто "Друг")
        const myUserId = "user_" + Math.floor(Math.random() * 100000);

        // Подключаем бесплатные ключи связи
        const pubnub = new PubNub({
            publishKey: 'pub-c-49bb2fa7-7c15-4fa7-9577-bd7efd373307',
            subscribeKey: 'sub-c-0c8da94e-d635-429a-ae57-55c4d5162ffb',
            userId: myUserId
        });

        // Название вашей секретной комнаты связи (можете изменить на любое свое)
        const channelName = 'smax_private_room_art';

        // Слушаем входящие сообщения в реальном времени
        pubnub.addListener({
            message: function(event) {
                const data = event.message;
                const isMe = data.senderId === myUserId;
                
                // Добавляем сообщение на экран
                const row = document.createElement('div');row.classList.add('msg-row', isMe ? 'my-msg' : 'friend-msg');
                row.innerHTML = `
                    <div class="msg-author">${isMe ? 'Вы' : 'Друг'}</div>
                    <div class="bubble">${data.text}</div>
                `;
                msgBox.appendChild(row);
                msgBox.scrollTop = msgBox.scrollHeight;
            }
        });

        // Подключаемся к комнате
        pubnub.subscribe({
            channels: [channelName]
        });

        // Функция отправки букв на сервер
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            pubnub.publish({
                channel: channelName,
                message: {
                    senderId: myUserId,
                    text: text
                }
            });

            msgInput.value = '';
        }

        sendClick.onclick = sendMessage;
        msgInput.onkeydown = function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        };
    </script>

</body>
</html>
