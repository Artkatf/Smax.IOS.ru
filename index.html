<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smax</title>
    
    <!-- Подключаем самую надежную систему передачи данных, которая не блокируется -->
    <script src="https://jsdelivr.net"></script>

    <!-- ========================================== -->
    <!-- ЧАСТЬ 1: СТИЛИ (ВНЕШНИЙ ВИД САЙТА)       -->
    <!-- ========================================== -->
    <style>
        :root {
            --bg-dark: #0A0A0C;
            --panel-dark: #161618;
            --accent-green: #10B981;
            --bubble-user: #059669;
            --bubble-friend: #222224;
            --text-main: #F4F4F5;
            --text-muted: #A1A1AA;
            --border-color: #27272A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            letter-spacing: -0.5px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: var(--panel-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 24px;
            padding-left: 8px;
            background: linear-gradient(to right, var(--accent-green) 0%, var(--accent-green) 22%, var(--text-main) 22%, var(--text-main) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .menu-btn {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--text-main);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
            font-weight: 500;
        }

        .chat-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .status-block {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10B981;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            width: fit-content;
        }

        .msg-row.my-msg { align-self: flex-end; }
        .msg-row.friend-msg { align-self: flex-start; }

        .msg-author {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            padding: 0 6px;
        }
        .my-msg .msg-author { text-align: right; }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .my-msg .bubble {
            background-color: var(--bubble-user);
            color: #fff;border-bottom-right-radius: 4px;
        }

        .friend-msg .bubble {
            background-color: var(--bubble-friend);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .input-bar {
            padding: 16px 20px;
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 12px 18px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-green);
        }

        .send-btn {
            background-color: var(--accent-green);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 22px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- ЧАСТЬ 2: СТРУКТУРА (ЭЛЕМЕНТЫ ИНТЕРФЕЙСА)   -->
    <!-- ========================================== -->
    <div class="sidebar">
        <div class="app-title">Smax</div>
        <button class="menu-btn">🟢 Smax Комната</button>
        <div style="margin-top: auto; font-size: 11px; color: var(--text-muted); text-align: center;">
            Настоящий онлайн активен
        </div>
    </div>

    <div class="chat-stage">
        <div class="chat-header">
            <div class="chat-title">Smax</div>
            <div class="status-block">
                <div class="status-dot"></div>
                <span style="color: var(--text-muted);">Онлайн</span>
            </div>
        </div>
        
        <div class="messages-area" id="msg-box">
            <div class="msg-row friend-msg">
                <div class="msg-author">Система</div>
                <div class="bubble">Онлайн-канал связи запущен. Напишите сообщение и нажмите «Отправить», чтобы проверить связь!</div>
            </div>
        </div>

        <div class="input-bar">
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Наберите текст..." autocomplete="off">
                <button class="send-btn" id="send-click">Отправить</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ЧАСТЬ 3: СКРИПТ (СВЯЗЬ И КНОПКИ)          -->
    <!-- ========================================== -->
    <script>
        const msgBox = document.getElementById('msg-box');
        const msgInput = document.getElementById('msg-input');
        const sendClick = document.getElementById('send-click');

        const myId = "user_" + Math.floor(Math.random() * 100000);

        // Прямое подключение к нашему бесплатному защищенному серверу переписки
        const supabaseUrl = 'https://supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsY2x3emJ0am94c2NjbGdvZnVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDY4MTAwMDAsImV4cCI6MjAxMzgxMDAwMH0.3vX7R6_j-rYw-v_T7uW7-J1L8-A1L8-B2L8-C3L8';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const channel = supabaseClient.channel('smax_room_777');

        channel.on('broadcast', { event: 'shout' }, payload => {
            const data = payload.payload;
            // Код выведет сообщение друга только если ID отправителя отличается от вашего
            if (data.sender !== myId) {addMessageToScreen('Друг', data.text, 'friend-msg');
            }
        })
        .subscribe();

        function addMessageToScreen(author, text, className) {
            const row = document.createElement('div');
            row.classList.add('msg-row', className);
            row.innerHTML = `
                <div class="msg-author">${author}</div>
                <div class="bubble">${text}</div>
            `;
            msgBox.appendChild(row);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            // 1. Мгновенно рисуем сообщение у себя на экране (Вы)
            addMessageToScreen('Вы', text, 'my-msg');

            // 2. Отправляем в эфир для друга
            channel.send({
                type: 'broadcast',
                event: 'shout',
                payload: { sender: myId, text: text }
            });

            msgInput.value = '';
        }

        sendClick.onclick = sendMessage;
        msgInput.onkeydown = function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        };
    </script>

</body>
</html>
